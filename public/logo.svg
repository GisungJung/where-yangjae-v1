<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="비즈밥">
  <title>비즈밥</title>
  <desc>비즈데이터 사내 맛집 평가 서비스 로고 — 밥그릇 핀 + 비즈밥 워드마크 (브랜드 시안 A).</desc>

  <!-- 밥그릇 핀 아이콘 -->
  <g transform="translate(14 12) scale(1.5)">
    <path d="M18 46C6 27 4.5 21 4.5 13.5 4.5 5.5 10.5 1.5 18 1.5s13.5 4 13.5 12c0 7.5-1.5 13.5-13.5 32.5Z" fill="#FF6B35"/>
    <circle cx="18" cy="14.5" r="8.8" fill="#FFFFFF"/>
    <path d="M12 15a6 6 0 0 0 12 0Z" fill="#D54E18"/>
    <path d="M15.5 12.6c0-1.6 1-1.6 1-3.2M20 12.6c0-1.6 1-1.6 1-3.2" stroke="#D54E18" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 워드마크 -->
  <text x="82" y="60" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="50" font-weight="900" letter-spacing="-2"><tspan fill="#1A1A1A">비즈</tspan><tspan fill="#FF6B35">밥</tspan></text>
  <text x="84" y="84" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" fill="#6b6b6b">오늘 뭐먹지? — 양재 · 남부터미널</text>
</svg>
